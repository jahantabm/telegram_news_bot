name: JAHANTAB Telegram News Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: jahantab-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser pillow


      # ==========================================
      # PREPARE STATE
      # ==========================================

      - name: Prepare state
        run: |

          echo "=========================================="
          echo "JAHANTAB STATE"
          echo "=========================================="

          mkdir -p state

          # اگر فایل‌های قدیمی در ریشه وجود داشته باشند،
          # bot.py خودش آنها را به state منتقل می‌کند.

          touch state/sent_links.txt
          touch state/sent_titles.txt
          touch state/sent_hashes.txt
          touch state/last_publish.txt

          echo "State directory:"
          ls -la state

          echo "Saved links:"
          grep -cve '^[[:space:]]*$' state/sent_links.txt || true

          echo "Saved titles:"
          grep -cve '^[[:space:]]*$' state/sent_titles.txt || true

          echo "=========================================="


      # ==========================================
      # RUN BOT
      # ==========================================

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python -u bot.py


      # ==========================================
      # SAVE STATE
      # ==========================================

      - name: Save bot state
        if: always()
        run: |

          echo "=========================================="
          echo "SAVING JAHANTAB BOT STATE"
          echo "=========================================="

          mkdir -p state

          # --------------------------------------
          # MAKE SURE STATE FILES EXIST
          # --------------------------------------

          touch state/sent_links.txt
          touch state/sent_titles.txt
          touch state/sent_hashes.txt
          touch state/last_publish.txt


          # --------------------------------------
          # SHOW STATE
          # --------------------------------------

          echo "State files after bot execution:"

          ls -la state

          echo ""
          echo "Saved links:"
          grep -cve '^[[:space:]]*$' state/sent_links.txt || true

          echo "Saved titles:"
          grep -cve '^[[:space:]]*$' state/sent_titles.txt || true


          # --------------------------------------
          # GIT CONFIG
          # --------------------------------------

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # --------------------------------------
          # ADD STATE
          # --------------------------------------

          git add state/


          # --------------------------------------
          # COMMIT / PUSH
          # --------------------------------------

          if git diff --cached --quiet; then

            echo "No state changes to save."

          else

            git commit \
              -m "Update JAHANTAB bot state"

            git push

            echo "Bot state successfully saved."

          fi


          echo "=========================================="