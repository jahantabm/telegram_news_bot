name: JAHANTAB Telegram News Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


# ============================================================
# جلوگیری از اجرای هم‌زمان چند Run
# ============================================================

concurrency:
  group: jahantab-news-bot
  cancel-in-progress: false


# ============================================================
# دسترسی برای ذخیره sent_links.txt داخل Repository
# ============================================================

permissions:
  contents: write


jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser pillow


      # --------------------------------------------------------
      # نمایش وضعیت sent_links.txt قبل از اجرا
      # --------------------------------------------------------

      - name: Check sent links
        run: |
          echo "=========================================="
          echo "JAHANTAB SENT LINKS STATUS"
          echo "=========================================="

          if [ -f sent_links.txt ]; then
            echo "sent_links.txt exists."

            COUNT=$(grep -cve '^[[:space:]]*$' sent_links.txt || true)

            echo "Saved sent links: $COUNT"
            echo "File size:"
            ls -lh sent_links.txt

          else
            echo "sent_links.txt does not exist yet."
            touch sent_links.txt
          fi

          echo "=========================================="


      # --------------------------------------------------------
      # اجرای Bot
      # --------------------------------------------------------

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python -u bot.py


      # --------------------------------------------------------
      # ذخیره sent_links.txt داخل GitHub
      # --------------------------------------------------------

      - name: Save sent links
        if: always()
        run: |

          echo "=========================================="
          echo "SAVING SENT LINKS"
          echo "=========================================="

          if [ ! -f sent_links.txt ]; then
            echo "sent_links.txt does not exist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_links.txt

          if git diff --cached --quiet; then
            echo "No changes to sent_links.txt"
            exit 0
          fi

          git commit -m "Update JAHANTAB sent links"

          git push

          echo "sent_links.txt successfully saved."
          echo "=========================================="