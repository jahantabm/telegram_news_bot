name: Telegram News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: telegram-news-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai pillow beautifulsoup4 feedparser googlenewsdecoder

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: "@jahantab_news"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -u bot.py

      - name: Save sent links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_links.txt

          if git diff --cached --quiet; then
            echo "No changes to sent_links.txt"
          else
            git commit -m "Update sent links"
            git push
          fi