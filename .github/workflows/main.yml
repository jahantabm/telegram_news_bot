name: JAHANTAB Telegram News Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


# ============================================================
# جلوگیری از اجرای هم‌زمان
# ============================================================

concurrency:
  group: jahantab-news-bot
  cancel-in-progress: false


# ============================================================
# اجازه ذخیره فایل‌های ضدتکرار در Repository
# ============================================================

permissions:
  contents: write


jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # نصب کتابخانه‌ها
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser pillow


      # --------------------------------------------------------
      # بررسی فایل‌های ضدتکرار
      # --------------------------------------------------------

      - name: Prepare deduplication files
        run: |

          echo "=========================================="
          echo "JAHANTAB DEDUPLICATION STATUS"
          echo "=========================================="

          if [ ! -f sent_links.txt ]; then
            echo "sent_links.txt not found."
            echo "Creating it..."
            touch sent_links.txt
          else
            echo "sent_links.txt found."

            COUNT=$(grep -cve '^[[:space:]]*$' sent_links.txt || true)

            echo "Saved links: $COUNT"
          fi


          if [ ! -f sent_titles.txt ]; then
            echo "sent_titles.txt not found."
            echo "Creating it..."
            touch sent_titles.txt
          else
            echo "sent_titles.txt found."

            COUNT=$(grep -cve '^[[:space:]]*$' sent_titles.txt || true)

            echo "Saved titles: $COUNT"
          fi


          echo "=========================================="


      # --------------------------------------------------------
      # اجرای Bot
      # --------------------------------------------------------

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python -u bot.py


      # --------------------------------------------------------
      # ذخیره فایل‌های ضدتکرار
      # --------------------------------------------------------

      - name: Save deduplication files
        if: always()
        run: |

          echo "=========================================="
          echo "SAVING JAHANTAB DEDUPLICATION DATA"
          echo "=========================================="


          if [ ! -f sent_links.txt ]; then
            echo "sent_links.txt does not exist."
            touch sent_links.txt
          fi


          if [ ! -f sent_titles.txt ]; then
            echo "sent_titles.txt does not exist."
            touch sent_titles.txt
          fi


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add sent_links.txt
          git add sent_titles.txt


          if git diff --cached --quiet; then

            echo "No changes to deduplication files."

          else

            git commit \
              -m "Update JAHANTAB deduplication data"

            git push

            echo "Deduplication files successfully saved."

          fi


          echo "=========================================="